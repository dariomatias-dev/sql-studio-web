name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dummy EmailJS credentials so /contact and /download attempt a real
# request in e2e (which the specs intercept) instead of failing early on
# the "missing env vars" guard. NEXT_PUBLIC_* vars are inlined at build
# time, so they must be set for the build step, not just at runtime — keep
# these in sync with playwright.config.ts's webServer.env.
env:
  NEXT_PUBLIC_SERVICE_ID: test-service-id
  NEXT_PUBLIC_TEMPLATE_ID: test-template-id
  NEXT_PUBLIC_PUBLIC_KEY: test-public-key

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      # include-hidden-files: needed for .next, a dot-prefixed directory.
      # Pinned to v4: act's local artifact server (nektos/act#6022).
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Pinned to v4: act's local artifact server (nektos/act#6022).
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
